<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title data-i18n="index.pageTitle">ShareWeb · File Station</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/static/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="stylesheet" href="/static/css/app.css?v=20261108-9">
  <script src="/static/js/prefs.js?v=20261108-1"></script>
</head>
<body class="home">
  <main class="container">
    <header class="topbar">
      <div class="brand">
        <div class="logo cloud"><img src="/static/favicon.svg" alt=""></div>
        <div>
          <h1>ShareWeb</h1>
          <p class="muted" style="margin:0" data-i18n="brand.tagline">File Station</p>
        </div>
      </div>
      <div class="prefs" data-prefs></div>
    </header>

    <!-- 宽屏时两栏: 左边上传 / 下载, 右边本地历史 (高度与左边对齐); 窄屏时上下排列 -->
    <div class="home-grid">
    <!-- 上传 / 下载两个面板叠放在同一格里 (见 .mode-stage), 卡片高度取两者中较高的, 切换时页面布局不变 -->
    <section class="card mode-init" id="mainCard" data-mode="upload">
      <div class="mode-switch" id="modeSwitch" role="tablist" data-mode="upload">
        <span class="mode-thumb" aria-hidden="true"></span>
        <button type="button" role="tab" id="tabUpload" data-mode="upload" aria-controls="panelUpload" aria-selected="true" data-i18n="tab.upload">Upload</button>
        <button type="button" role="tab" id="tabDownload" data-mode="download" aria-controls="panelDownload" aria-selected="false" tabindex="-1" data-i18n="tab.download">Download</button>
      </div>
      <div class="mode-stage" data-mode="upload">
        <div class="mode-panel" id="panelUpload" role="tabpanel" aria-labelledby="tabUpload">
          <div id="dropzone" class="dropzone">
            <h2 class="drop-title" data-i18n="index.dropTitle">Drop a file here</h2>
            <p class="muted drop-hint" data-i18n-html="index.dropHint">Or click to choose one, or press <kbd>Ctrl</kbd>+<kbd>V</kbd> to paste text</p>
            <p class="muted drop-hint-touch" data-i18n="index.dropHintTouch">Photos, videos or any other file</p>
            <input id="fileInput" type="file" hidden>
            <button id="pickBtn" class="primary accent narrow-btn" data-i18n="index.pick">Choose file</button>
          </div>
          <div class="divider" data-i18n="index.or">or</div>
          <textarea id="pasteArea" class="textpaste" placeholder="Paste text here to share it" data-i18n-placeholder="index.pastePh"></textarea>
          <button id="textShareBtn" class="primary narrow-btn" data-i18n="index.textBtn">Create text share</button>
        </div>
        <div class="mode-panel" id="panelDownload" role="tabpanel" aria-labelledby="tabDownload">
          <h2 class="redeem-title" data-i18n="index.redeemTitle">Retrieve a share</h2>
          <div class="code-inputs" id="codeInputs">
            <input maxlength="1" inputmode="numeric" autocomplete="one-time-code" aria-label="1">
            <input maxlength="1" inputmode="numeric" aria-label="2">
            <input maxlength="1" inputmode="numeric" aria-label="3">
            <input maxlength="1" inputmode="numeric" aria-label="4">
          </div>
          <button id="redeemBtn" class="primary accent narrow-btn" data-i18n="index.redeemBtn">Retrieve</button>
          <div id="redeemMsg" class="error"></div>
          <p class="meta redeem-hint" data-i18n-html="index.redeemHint">Enter code <b>0000</b> for instructions</p>
        </div>
      </div>
      <div id="progressWrap" class="hidden">
        <div class="progress"><span id="progressBar"></span></div>
        <div id="progressText" class="muted" style="margin-top:8px;font-size:13px"></div>
      </div>
      <div id="result" class="hidden"></div>
    </section>

    <section class="card history-card">
      <div class="row between">
        <h2 style="margin:0" data-i18n="index.historyTitle">Local history</h2>
        <div class="history-actions">
          <button id="clearGone" class="link" data-i18n="index.clearGone" disabled>Clear unavailable</button>
          <span class="faint" aria-hidden="true">·</span>
          <button id="clearHistory" class="link" data-i18n="index.clear">Clear all</button>
        </div>
      </div>
      <div id="history" style="margin-top:8px"></div>
    </section>
    </div>

    <p class="center faint" style="font-size:12px" data-i18n="index.footer" data-i18n-args='{"days":30,"size":"1 GB"}'>Files are deleted automatically after 30 days · Max file size 1 GB</p>
  </main>
  <script src="/static/js/sha256.js?v=20261017-4"></script>
  <script src="/static/js/app.js?v=20261108-7"></script>
</body>
</html>
